# Configurations
title:            HIPC
longtitle:        High-Performance Parallel and Distributed Systems
author:           Steven Wright
email:            steven.wright@york.ac.uk
description: >
  HIPC

version:          1.0
gitbook_version:  3.2.3

url:              'https://www-users.york.ac.uk/'
baseurl:          '/~saw586/hipc'
rss:              RSS

# bootstrap: use the remote theme for the site itself
#remote_theme: sighingnow/jekyll-gitbook

toc:
  enabled: true
  h_min: 1
  h_max: 2

# markdown render engine.
markdown:         kramdown
kramdown:
  auto_ids:               true
  input:                  GFM
  math_engine:            mathjax
  smart_quotes:           lsquo,rsquo,ldquo,rdquo
  toc_levels:             1..6
  syntax_highlighter:     rouge
  syntax_highlighter_opts:
    guess_lang:           true

syntax_highlighter_style: github

markdown_ext:     markdown,mkdown,mkdn,mkd,md

# Permalinks
permalink:        /:categories/:title:output_ext

exclude:
  - _drafts

collections:
  about:
    output: true
    permalink: /:collection/:path/
  lectures:
    output: true
    permalink: /:collection/:path/
  practicals:
    output: true
    permalink: /:collection/:path/

page_width: 800px

destination:      ./_site
incremental:      false
regenerate:       true

jekyll-spaceship:
  # default enabled processors
  processors:
    - table-processor

plugins:
  - jekyll-feed
  - jekyll-readme-index
  - jemoji
  - jekyll-spaceship
